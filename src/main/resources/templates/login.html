<!-- login.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <style>
        
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Login</h1>
        <!-- <div class="error-message" th:if="${param.error}" th:text="${session['SPRING_SECURITY_LAST_EXCEPTION'].message}"></div> -->
        
        <form th:action="@{/login}" method="post">

            <label for="email">Email</label>
            <!-- <input type="email" name="email" id="email" placeholder="Enter your email" required> -->
            <input type="email" name="username" id="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <!-- <input type="password" name="password" id="password" placeholder="Enter your password" required> -->
            <input type="password" name="password" id="password" placeholder="Enter your password" required>
            <button type="submit">Login</button>

        </form>

        <div class="register-link">
            <p>Don't have an account? <a th:href="@{/register}">Register</a></p>
        </div>

        <div class="backhome">
            <a href="/home">Back to Home</a>
        </div>

    </div>
</body>
</html>
