<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Job Details</title>
		<style>
		    .apply-btn {
		        background-color: #007bff;
		        color: white;
		        border: none;
		        padding: 12px 25px;
		        border-radius: 6px;
		        cursor: pointer;
		        font-size: 16px;
		        font-weight: bold;
		    }

		    .apply-btn:hover {
		        background-color: #0056b3;
		    }
			.company-section {
			    display: flex;
			    align-items: center;
			    gap: 15px;
			    margin-bottom: 20px;
			}

			.company-photo {
			    width: 70px;
			    height: 70px;
			    object-fit: cover;
			    border-radius: 50%;
			    border: 2px solid #ddd;
			    display: block;
			    transition: transform 0.2s ease;
			}

			.company-photo:hover {
			    transform: scale(1.08);
			}
		</style>
		
</head>

<body>

<h1>Job Details</h1>

<div>

    <h2 th:text="${job.title}"></h2>
	
	<div class="company-section">

	    <a th:href="@{/company/{id}(id=${job.employer.id})}">

	        <img th:if="${job.employer.user.profilePhoto != null}"
	             th:src="@{'/uploads/' + ${job.employer.user.profilePhoto}}"
	             alt="Company Photo"
	             class="company-photo">

	    </a>

	    <div>
	        <h3 th:text="${job.employer.user.name}">
	            Company Name
	        </h3>
	    </div>

	</div>

    <p>
        <strong>Description:</strong>
        <span th:text="${job.description}"></span>
    </p>

    <p>
        <strong>Category:</strong>
        <span th:text="${job.category.name}"></span>
    </p>

    <p>
        <strong>Budget:</strong>
        <span th:text="${job.budget}"></span>
    </p>

    <p>
        <strong>Salary Min:</strong>
        <span th:text="${job.salaryMin}"></span>
    </p>

    <p>
        <strong>Salary Max:</strong>
        <span th:text="${job.salaryMax}"></span>
    </p>

    <p>
        <strong>Employment Type:</strong>
        <span th:text="${job.employmentType}"></span>
    </p>

    <p>
        <strong>Experience Level:</strong>
        <span th:text="${job.experienceLevel}"></span>
    </p>

    <p>
        <strong>Duration:</strong>
        <span th:text="${job.duration}"></span>
    </p>

    <p>
        <strong>Deadline:</strong>
        <span th:text="${job.deadline}"></span>
    </p>

    <p>
        <strong>Status:</strong>
        <span th:text="${job.status}"></span>
    </p>

    <p>
        <strong>Created At:</strong>
        <span th:text="${job.createdAt}"></span>
    </p>
	<div sec:authorize="hasRole('FREELANCER')">

	  
	    <a th:if="${job.status.name() == 'OPEN' and !alreadyApplied}"
	       th:href="@{/apply-job/{id}(id=${job.id})}"
	       class="apply-btn">

	        Apply Now

	    </a>

	    
	    <span th:if="${job.status.name() == 'OPEN' and alreadyApplied}"
	          class="applied-btn">

	        Already Applied

	    </span>

	   
	    <span th:if="${job.status.name() == 'CLOSED'}"
	          class="closed">

	        Applications Closed

	    </span>

	</div>
    <a href="/jobHome">Back to Jobs</a>

</div>

</body>
</html>
