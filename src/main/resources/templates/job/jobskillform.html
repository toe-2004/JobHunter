<form th:action="@{/job/skill}"
      method="post"
      th:object="${skill}">

    <label>Skill Name</label>

    <input type="text"
           th:field="*{name}"
           required>

    <input type="hidden"
           name="jobId"
           th:value="${jobId}">

    <button type="submit">
        Add Skill
    </button>

</form>
