<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="_csrf" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:content="${_csrf.headerName}">
    
    <title>Create Job</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/create-job.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/create-job.js}"></script>

</head>

<body>

    <div class="page-container">

        <!-- SIDEBAR -->

        <div class="sidebar-container">
            <div th:replace="~{fragments/sidebar_for_employer :: sidebar}"></div>
        </div>

        <!-- MAIN CONTENT -->

        <div class="main-content">

            <div class="form-container">

                <div class="form-card">

                    <div class="page-header">

                        <h2 th:text="${job.id == null ? 'Create Job Post' : 'Edit Job Post'}">
                            Create Job Post
                        </h2>
                        <p>
                            Fill in the details below to create a new job opportunity.
                        </p>

                    </div>

                    <form th:action="${job.id == null}
                            ? @{/create-job}
                            : @{/edit-job/{id}(id=${job.id})}"
                            method="post"
                            th:object="${job}">

                        <div class="form-section">

                            <div class="section-title">
                                Job Information
                            </div>
                            <div class="mb-3">

                                <label class="form-label">
                                    Job Title <span class="required">*</span>
                                </label>
                                <input
                                    type="text"
                                    class="form-control"
                                    th:field="*{title}"
                                    placeholder="e.g. Frontend Developer"
                                    required>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Description <span class="required">*</span>
                                </label>
                                <textarea
                                    class="form-control"
                                    th:field="*{description}"
                                    placeholder="Describe the job responsibilities, requirements and expectations..."
                                    required>
                                </textarea>

                            </div>

                            <div class="mb-3">

                                <label class="form-label">
                                    Category <span class="required">*</span>
                                </label>
                                <select
                                    class="form-select"
                                    th:field="*{category}"
                                    required>

                                    <option value="">
                                        Select a category
                                    </option>
                                    <option
                                        th:each="c : ${categories}"
                                        th:value="${c.id}"
                                        th:text="${c.name}">
                                    </option>

                                </select>

                            </div>

                        </div>

                        <div class="form-section">

                            <div class="section-title">
                                Budget & Salary
                            </div>
                            <div class="salary-row">

                                <div>

                                    <label class="form-label">
                                        Salary Min
                                    </label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        class="form-control"
                                        th:field="*{salaryMin}"
                                        placeholder="0.00">

                                </div>

                                <div>

                                    <label class="form-label">
                                        Salary Max
                                    </label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        class="form-control"
                                        th:field="*{salaryMax}"
                                        placeholder="0.00">

                                </div>

                                <div>

                                    <label class="form-label">
                                        Fixed Budget
                                    </label>
                                    <input
                                        type="number"
                                        step="0.01"
                                        class="form-control"
                                        th:field="*{budget}"
                                        placeholder="0.00">

                                </div>

                            </div>

                        </div>

                        <div class="form-section">

                            <div class="section-title">
                                Job Details
                            </div>
                            <div class="details-row">

                                <div>

                                    <label class="form-label">
                                        Employment Type
                                    </label>
                                    <select
                                        class="form-select"
                                        th:field="*{employmentType}">

                                        <option
                                            th:each="t : ${employmentTypes}"
                                            th:value="${t}"
                                            th:text="${t}">
                                        </option>

                                    </select>

                                </div>

                                <div>

                                    <label class="form-label">
                                        Duration
                                    </label>
                                    <select
                                        class="form-select"
                                        th:field="*{duration}">

                                        <option
                                            th:each="d : ${durations}"
                                            th:value="${d}"
                                            th:text="${d}">
                                        </option>

                                    </select>

                                </div>

                                <div>

                                    <label class="form-label">
                                        Experience Level
                                    </label>
                                    <select
                                        class="form-select"
                                        th:field="*{experienceLevel}">

                                        <option
                                            th:each="e : ${experienceLevels}"
                                            th:value="${e}"
                                            th:text="${e}">
                                        </option>

                                    </select>

                                </div>

                            </div>

                            <div class="mt-3">

                                <label class="form-label">
                                    Application Deadline
                                </label>
                                <input
                                    type="datetime-local"
                                    class="form-control"
                                    th:field="*{deadline}">

                            </div>

                        </div>

                        <div class="form-section">

                            <div class="skills-header">

                                <div class="section-title">
                                    Skills
                                </div>
                                <button type="button"
                                        class="create-skill-btn"
                                        id="openSkillBtn">
                                    + Create New Skill
                                </button>

                            </div>

                            <div class="skill-dropdown">

                                <button type="button"
                                        class="skill-dropdown-btn"
                                        id="skillDropdownBtn">

                                    <span id="selectedSkillsText">
                                        Select your skills
                                    </span>
                                    <span class="dropdown-arrow">▼</span>

                                </button>

                                <div class="skill-dropdown-menu"
                                    id="skillDropdownMenu">

                                    <div th:each="skill : ${skills}"
                                        class="skill-option"
                                        th:classappend="${selectedSkillIds != null and selectedSkillIds.contains(skill.id)} ? 'selected' : ''"
                                        th:attr="data-id=${skill.id}">

                                        <span class="skill-check">✓</span>
                                        <span th:text="${skill.name}">
                                            Java
                                        </span>

                                    </div>
                                    <div th:if="${skills == null or skills.isEmpty()}"
                                        class="no-skills">
                                        No skills available.
                                    </div>

                                </div>

                            </div>

                            <div id="selectedSkillInputs"></div>

                        </div>

                        <div class="form-actions">

                            <a
                                href="javascript:history.back()"
                                class="cancel-btn">
                                Cancel
                            </a>
                            <button
                                type="submit"
                                class="submit-btn"
                                th:text="${job.id == null
                                    ? 'Create Job'
                                    : 'Update Job'}">
                                Create Job
                            </button>

                        </div>

                    </form>

                    <div class="modal-overlay" id="skillModal">

                        <div class="skill-modal">

                            <div class="modal-header">

                                <div>
                                    <h2>Create New Skill</h2>
                                    <p>
                                        Add a skill that employers can require for this job.
                                    </p>
                                </div>

                                <button type="button"
                                        class="close-btn"
                                        id="closeSkillBtn">
                                    &times;
                                </button>

                            </div>

                            <form id="skillForm">

                                <div class="modal-body">

                                    <label for="skillName">
                                        Skill Name
                                    </label>
                                    <input type="text"
                                        id="skillName"
                                        name="name"
                                        placeholder="Example: Java"
                                        required>

                                </div>

                                <div class="modal-footer">

                                    <button type="button"
                                            class="modal-cancel-btn"
                                            id="cancelSkillBtn">
                                        Cancel
                                    </button>
                                    <button type="submit"
                                            class="modal-create-btn">
                                        Create Skill
                                    </button>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</body>
</html>
