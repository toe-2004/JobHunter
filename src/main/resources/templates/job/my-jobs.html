<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>My Jobs</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .job-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .job-title {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .description {
            margin: 15px 0;
            color: #555;
        }

        .info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin: 15px 0;
        }

        .info-box {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 5px;
        }

        .label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        .skills {
            margin-top: 15px;
        }

        .skill {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            padding: 6px 12px;
            margin: 4px;
            border-radius: 15px;
        }

        .actions {
            margin-top: 20px;
        }

        .edit-btn {
            display: inline-block;
            padding: 10px 20px;
            background: #1976d2;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .edit-btn:hover {
            background: #125ca1;
        }

        .no-jobs {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 8px;
        }
		
		
		.status-btn,
		.delete-btn {
		    display: inline-block;
		    padding: 10px 20px;
		    border: none;
		    border-radius: 5px;
		    color: white;
		    cursor: pointer;
		    text-decoration: none;
		    margin-left: 10px;
		}

		.status-btn {
		    background: #ff9800;
		}

		.status-btn:hover {
		    background: #e68900;
		}

		.delete-btn {
		    background: #d32f2f;
		}

		.delete-btn:hover {
		    background: #b71c1c;
		}

		.open-status {
		    color: green;
		    font-weight: bold;
		}

		.closed-status {
		    color: red;
		    font-weight: bold;
		}

    </style>

</head>


<body>


<div class="container">

    <h1>My Jobs</h1>


    <div th:if="${#lists.isEmpty(jobs)}"
         class="no-jobs">

        <h3>No jobs found.</h3>

        <a th:href="@{/create-job}">
            Create your first job
        </a>

    </div>


    <div th:each="job : ${jobs}"
         class="job-card">

        <div class="job-title"
             th:text="${job.title}">
        </div>

        <div class="description"
             th:text="${job.description}">
        </div>


        <div class="info">


            <div class="info-box">

                <span class="label">
                    Category
                </span>

                <span th:text="${job.category.name}">
                </span>

            </div>


            <div class="info-box">

                <span class="label">
                    Employment Type
                </span>

                <span th:text="${job.employmentType}">
                </span>

            </div>


            <div class="info-box">

                <span class="label">
                    Experience Level
                </span>

                <span th:text="${job.experienceLevel}">
                </span>

            </div>


            <div class="info-box">

                <span class="label">
                    Duration
                </span>

                <span th:text="${job.duration}">
                </span>

            </div>


            <div class="info-box">

                <span class="label">
                    Salary
                </span>

                <span th:text="${job.salaryMin + ' - ' + job.salaryMax}">
                </span>

            </div>


            <div class="info-box">

                <span class="label">
                    Budget
                </span>

                <span th:text="${job.budget}">
                </span>

            </div>


            <div class="info-box">

                <span class="label">
                    Deadline
                </span>

                <span th:text="${job.deadline}">
                </span>

            </div>


			<div class="info-box">

			    <span class="label">
			        Status
			    </span>

			    <span th:if="${job.status.name() == 'OPEN'}"
			          class="open-status">
			        OPEN
			    </span>

			    <span th:if="${job.status.name() == 'CLOSED'}"
			          class="closed-status">
			        CLOSED
			    </span>

			</div>

        </div>



        <div class="skills">

            <strong>Skills:</strong>

            <span th:if="${#lists.isEmpty(job.jobSkills)}">
                No skills
            </span>

            <span th:each="jobSkill : ${job.jobSkills}"
                  class="skill"
                  th:text="${jobSkill.skill.name}">
            </span>

        </div>


		<div class="actions">


		    <a class="edit-btn"
		       th:href="@{/edit-job/{id}(id=${job.id})}">
		        Edit
		    </a>

		    <form th:action="@{/job-status/{id}(id=${job.id})}"
		          method="post"
		          style="display:inline;">

		        <button type="submit"
		                class="status-btn"
		                th:text="${job.status.name() == 'OPEN'
		                          ? 'Close Job'
		                          : 'Open Job'}">
		            Close
		        </button>

		    </form>


		    <form th:action="@{/delete-job/{id}(id=${job.id})}"
		          method="post"
		          style="display:inline;"
		          onsubmit="return confirm('Are you sure you want to delete this job?');">

		        <button type="submit"
		                class="delete-btn">
		            Delete
		        </button>

		    </form>

		</div>


    </div>


</div>


</body>

</html>
