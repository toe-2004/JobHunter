<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Hire Freelancer</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .freelancer-info {
            background: #f1f5f9;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .submit-btn {
            margin-top: 25px;
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .submit-btn:hover {
            background: #218838;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Hire Freelancer</h1>



    <div class="freelancer-info">

        <h2 th:text="${freelancer.user.name}">
            Freelancer Name
        </h2>

        <p>
            <strong>Title:</strong>

            <span th:text="${freelancer.title}">
            </span>
        </p>

    </div>




    <form th:action="@{/hire-freelancer/{id}(id=${freelancer.id})}"
          th:object="${engagement}"
          method="post">


        <label>Engagement Title:</label>

        <input type="text"
               th:field="*{title}"
               required>


        <label>Description:</label>

        <textarea th:field="*{description}"
                  required></textarea>


        <label>Monthly Rate:</label>

        <input type="number"
               step="0.01"
               th:field="*{monthlyRate}"
               required>


        <label>Category:</label>

        <select name="categoryId"
                required>

            <option value="">
                 Select Category 
            </option>

            <option th:each="category : ${categories}"
                    th:value="${category.id}"
                    th:text="${category.name}">
            </option>

        </select>


        <label>Start Date:</label>

        <input type="datetime-local"
               th:field="*{startDate}"
               required>


        <label>End Date:</label>

        <input type="datetime-local"
               th:field="*{endDate}"
               required>


        <button type="submit"
                class="submit-btn">

            Send Hire Offer

        </button>

    </form>

</div>

</body>

</html>
