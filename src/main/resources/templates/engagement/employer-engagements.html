<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>My Hire Offers</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 1100px;
            margin: auto;
        }

        h1 {
            margin-bottom: 25px;
        }

        .offer-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.1);
        }

        .info {
            margin: 8px 0;
        }

        .label {
            font-weight: bold;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .accepted {
            background: #d4edda;
            color: #155724;
        }

        .rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .empty {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>My Hire Offers</h1>


    <div th:if="${#lists.isEmpty(engagements)}"
         class="empty">

        <h3>You have not sent any hire offers.</h3>

    </div>


    <div th:each="engagement : ${engagements}"
         class="offer-card">


        <h2 th:text="${engagement.title}">
            Engagement Title
        </h2>


        <p class="info">

            <span class="label">
                Freelancer:
            </span>

            <span th:text="${engagement.freelancer.user.name}">
            </span>

        </p>


        <p class="info">

            <span class="label">
                Freelancer Email:
            </span>

            <span th:text="${engagement.freelancer.user.email}">
            </span>

        </p>


        <p class="info">

            <span class="label">
                Freelancer Title:
            </span>

            <span th:text="${engagement.freelancer.title}">
            </span>

        </p>


        <p class="info">

            <span class="label">
                Description:
            </span>

            <span th:text="${engagement.description}">
            </span>

        </p>


        <p class="info">

            <span class="label">
                Category:
            </span>

            <span th:text="${engagement.category.name}">
            </span>

        </p>


        <p class="info">

            <span class="label">
                Monthly Rate:
            </span>

            <span th:text="${engagement.monthlyRate}">
            </span>

        </p>


        <p class="info">

            <span class="label">
                Start Date:
            </span>

            <span th:text="${engagement.startDate}">
            </span>

        </p>


        <p class="info">

            <span class="label">
                End Date:
            </span>

            <span th:text="${engagement.endDate}">
            </span>

        </p>


        <p class="info">

            <span class="label">
                Status:
            </span>

            <span th:classappend="${engagement.status.name() == 'PENDING'} ? ' pending' :
                                  (${engagement.status.name() == 'ACCEPTED'} ? ' accepted' : ' rejected')"
                  class="status"
                  th:text="${engagement.status}">
            </span>

        </p>


    </div>

</div>

</body>

</html>
