        .main-content {
            margin-left: 250px;
            padding: 20px;
            background-color: #f8f9fa;
            min-height: 100vh;
        }
        .profile-img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 5px solid #fff;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .profile-header {
            background: linear-gradient(90deg,rgba(18, 36, 227, 1) 0%, rgba(20, 134, 222, 1) 22%, rgb(6, 132, 234) 100%);
            color: white;
            padding: 2rem 0;
            margin-bottom: 2rem;
            border-radius: 10px;
        }
        .section-title {
            border-bottom: 2px solid #6e8efb;
            padding-bottom: 10px;
            margin-bottom: 20px;
            color: #333;
        }
        .contact-info i {
            width: 30px;
            text-align: center;
            margin-right: 10px;
            color: #6e8efb;
        }
        .experience-item, .education-item {
            margin-bottom: 25px;
        }
        .experience-date, .education-date {
            font-style: italic;
            color: #777;
        }
        .edit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
        }
        .skill-tag {
          display:inline-block;
          background:linear-gradient(90deg,rgba(18, 36, 227, 1) 0%, rgba(20, 134, 222, 1) 22%, rgb(6, 132, 234) 100%); 
          color: #ffffff; /* darker blue text */
          padding: 8px 15px;
          border-radius: 25px;
          font-size: 14px;
          font-weight: 500;
          white-space: nowrap;
          width:auto;
          margin-bottom:10px;
        }
    </style>
</head>
<body>

    <div class="main-content">
        <div class="profile-header position-relative">

            <p><b>Email:</b> <span th:text="${user.email}"></span></p>
            <p><b>Role:</b> <span th:text="${user.role}"></span></p>
            <img th:if="${user.profilePhoto != null}" th:src="@{'/uploads/' + ${user.profilePhoto}}" width="150">
        </div>
