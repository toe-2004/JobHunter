<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/employer_register&profile_edit_form.css}">
    <title>Profile Edit</title>

</head>

<body>

    <div class="form-container">

        <div class="form-header">
            <h1>Edit Employer Profile</h1>
            <p>Update your company information.</p>
        </div>

        <form th:action="@{/employer/profile/edit}"
          th:object="${profile}"
          method="post"
          novalidate>

            <div class="form-group">
                <label for="companyName">Company Name</label>
                <input type="text"
                   id="companyName"
                   th:field="*{companyName}"
                   th:errorclass="is-invalid">

                <div class="error" th:errors="*{companyName}"></div>
            </div>

            <div class="form-group">
                <label for="companyEmail">Company Email</label>
                <input type="email"
                   id="companyEmail"
                   th:field="*{companyEmail}"
                   th:errorclass="is-invalid">

                <div class="error" th:errors="*{companyEmail}"></div>
            </div>

            <div class="form-group">
                <label for="companyPhone">Company Phone</label>
                <input type="text"
                   id="companyPhone"
                   th:field="*{companyPhone}"
                   th:errorclass="is-invalid">

                <div class="error" th:errors="*{companyPhone}"></div>
            </div>

            <div class="form-group">
                <label for="companyLocation">Company Location</label>
                <input type="text"
                   id="companyLocation"
                   th:field="*{companyLocation}"
                   th:errorclass="is-invalid">

                <div class="error" th:errors="*{companyLocation}"></div>
            </div>

            <div class="form-group">
                <label for="companyDescription">Company Description</label>
                <textarea id="companyDescription"
                      th:field="*{companyDescription}"
                      rows="4"
                      th:errorclass="is-invalid"></textarea>

                <div class="error" th:errors="*{companyDescription}"></div>
            </div>

            <div class="form-group">
                <label for="name">Your name</label>
                <input type="text"
                    id="name"
                    th:field="*{name}"
                    th:errorclass="is-invalid">

                <div th:errors="*{name}"></div>
            </div>

            <div class="button-group">
                <a th:href="@{/employer/profile}" class="back-btn">
                    Cancel
                </a>

                <button type="submit" class="submit-btn">
                    Save changes
                </button>
            </div>
        
        </form>

    </div>

</body>

</html>
