<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Profile</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .current-photo {
            margin-top: 10px;
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #ddd;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            border: none;
            border-radius: 6px;
            background: #28a745;
            color: white;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #218838;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Edit Profile</h2>

    <form th:action="@{/employer/profile-update}"
          method="post"
          enctype="multipart/form-data">

        

        <label>Name:</label>

        <input type="text"
               name="name"
               th:value="${employer.user.name}"
               required>


       

        <label>Current Profile Photo:</label>

        <div>

            <img th:if="${employer.user.profilePhoto != null}"
                 th:src="@{'/uploads/' + ${employer.user.profilePhoto}}"
                 class="current-photo">

           
        </div>


       

        <label>Change Profile Photo:</label>

        <input type="file"
               name="profilePhoto"
               accept="image/*">


        <button type="submit">
            Update Profile
        </button>

    </form>


    <a th:href="@{/employer/profile}"
       class="back-btn">

         Back to Profile

    </a>

</div>

</body>

</html>
