<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Companies | JobHunter</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}" defer></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/company-list.css}">

    <style>

    </style>
</head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="companies-page">

    <div class="companies-header">
        <div class="header-icon">
            <i class="fa-solid fa-building"></i>
        </div>

        <h1>
            Explore <span>Companies</span>
        </h1>

        <p>
            Explore companies, discover exciting opportunities,
            and find the right workplace for your career goals.
        </p>

        <div class="company-summary">
            <span>
                <i class="fa-solid fa-building-circle-check"></i>
                <strong
                    th:text="${employers != null ? employers.size() : 0}">
                    0
                </strong>
                Companies Available
            </span>
        </div>
    </div>

    <div th:if="${employers == null || employers.isEmpty()}"
         class="empty-state">
        <div class="empty-icon">
            <i class="fa-regular fa-building"></i>
        </div>

        <h3>
            No Companies Found
        </h3>

        <p>
            There are currently no companies available.
        </p>
    </div>

    <div th:if="${employers != null && !employers.isEmpty()}"
         class="companies-grid">

        <div th:each="employer : ${employers}"
             class="company-card">

            <a th:href="@{/company/{id}(id=${employer.id})}"
               class="company-link">

                <img th:if="${employer.user != null
                            && employer.user.profilePhoto != null
                            && !employer.user.profilePhoto.isEmpty()}"
                     th:src="@{'/uploads/' + ${employer.user.profilePhoto}}"
                     class="company-photo"
                     alt="Company Photo">

                <div th:if="${employer.user == null
                            || employer.user.profilePhoto == null
                            || employer.user.profilePhoto.isEmpty()}"
                     class="company-placeholder">
                    <i class="fa-solid fa-building"></i>
                </div>

                <h3 th:text="${employer.companyName}">
                    Company Name
                </h3>

                <p class="company-location">
                    <i class="fa-solid fa-location-dot"></i>
                    <span th:text="${employer.companyLocation != null
                                    && !employer.companyLocation.isEmpty()
                                    ? employer.companyLocation
                                    : 'Location not specified'}">
                        Yangon
                    </span>
                </p>

            </a>

        </div>

    </div>

</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
