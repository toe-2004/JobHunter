<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Companies</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0;
        }

        .back-btn {
            text-decoration: none;
            padding: 10px 18px;
            background: #6c757d;
            color: white;
            border-radius: 6px;
        }

        .companies-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .company-card {
            background: white;
            padding: 25px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            transition: 0.2s;
        }

        .company-card:hover {
            transform: translateY(-5px);
        }

        .company-link {
            text-decoration: none;
            color: inherit;
        }

        .company-link:hover {
            color: inherit;
        }

        .company-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }

        .company-card h3 {
            margin: 15px 0 8px;
        }

        .company-location {
            color: #777;
        }

    </style>

</head>

<body>

<div class="container">


    <div class="page-header">

        <h1>All Companies</h1>

        <a th:href="@{/viewHomeJob}"
           class="back-btn">

            Home

        </a>

    </div>


 

    <div th:if="${employers == null || employers.isEmpty()}">

        <p>No companies found.</p>

    </div>




    <div class="companies-grid">

        <div th:each="employer : ${employers}"
             class="company-card">

            <a th:href="@{/company/{id}(id=${employer.id})}"
               class="company-link">


               

                <img th:if="${employer.user.profilePhoto != null}"
                     th:src="@{'/uploads/' + ${employer.user.profilePhoto}}"
                     class="company-photo"
                     alt="Company Photo">




             

                <h3 th:text="${employer.companyName}">
                    Company Name
                </h3>


          

                <p class="company-location"
                   th:text="${employer.companyLocation}">
                    Yangon
                </p>

            </a>

        </div>

    </div>

</div>

</body>

</html>
