<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Company Details</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
        }

        .company-detail-card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .company-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .company-photo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }

        .company-header h1 {
            margin: 5px 0;
        }

        .company-location {
            color: #777;
        }

        .company-info {
            margin-top: 30px;
        }

        .info-row {
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .info-label {
            font-weight: bold;
            display: inline-block;
            width: 180px;
        }

        .back-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 18px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="company-detail-card">


        <!-- Company Header -->

        <div class="company-header">


            <!-- Profile Photo -->

            <img th:if="${employer.user.profilePhoto != null}"
                 th:src="@{'/uploads/' + ${employer.user.profilePhoto}}"
                 class="company-photo"
                 alt="Company Photo">


      


            <!-- Company Name -->

            <h1 th:text="${employer.companyName}">
                Company Name
            </h1>


            <!-- Location -->

            <p class="company-location"
               th:text="${employer.companyLocation}">
                Yangon
            </p>

        </div>


        <!-- Company Information -->

        <div class="company-info">


            <div class="info-row">

                <span class="info-label">
                    Company Name:
                </span>

                <span th:text="${employer.companyName}">
                    Company
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Email:
                </span>

                <span th:text="${employer.companyEmail}">
                    company@gmail.com
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Phone:
                </span>

                <span th:text="${employer.companyPhone}">
                    09-123456789
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Location:
                </span>

                <span th:text="${employer.companyLocation}">
                    Yangon
                </span>

            </div>


            <div class="info-row">

                <span class="info-label">
                    Description:
                </span>

                <span th:text="${employer.companyDescription}">
                    Company description
                </span>

            </div>


        </div>


        <a th:href="@{/companies}"
           class="back-btn">

             Back to Companies

        </a>

    </div>

</div>

</body>

</html>
