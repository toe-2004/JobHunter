<!-- HOME hsu-->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--   <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/css/all.min.css}"> -->
  <script th:src="@{/js/bootstrap.bundle.min.js}" defer></script>
  <title>Home</title>
  <style>
    h1 {
      margin-left: 5% !important;
    }

    #logo {
      width: 30px;
      height: 30px;
      display: block;
    }

    #title {
      font-family: sans-serif;
      color: #4237f1;
      font-weight: bold;
    }

    #navitems {
      padding-right: 100px;
    }

    #navitems a {
      color: #4237f1;
      /* font-family: 'Sora', sans-serif; */
      /* font-weight: 600; */
    }

  </style>
</head>

<body>
  <div class="container-fluid bg-white">
    <div class="row g-0 justify-content-center">

      <!-- Navigation Bar -->
      <p id="userIdHolder" class="d-none" th:text="${userId}"></p>
      <nav class="navbar py-2 position-fixed bg-light z-3">
        <h1 class="h4 col-1 col-md-2 col-lg-3 px-4 text-center justify-content-start d-flex align-items-center">
          <a class="navbar-brand" href="#">
            <!-- <img id="logo" th:src="@{/images/skill-connect-logo.png}" alt="Skill Connect"> -->
            <i class="fa-solid fa-briefcase text-primary"></i>
          </a>
          <span id="title" class="d-none d-lg-inline fw-0 lh-lg">Job Hunter</span>
        </h1>
        <div class="col-9 col-md-9 col-lg-6 d-flex justify-content-end px-4" id="navitems">
          <ul class="navbar nav">
            <li class="nav-item px-2 d-none d-lg-inline d-md-inline"><a class="nav-link active" href="/home">Home</a>
            </li>
            <li class="nav-item px-2 d-none d-lg-inline d-md-inline"><a class="nav-link active"
                href="/jobposts/all">Jobs</a></li>
            <!-- <li class="nav-item px-2 d-none d-lg-inline d-md-inline"><a class="nav-link active" href="#">Companies</a>
            </li> -->
            <li class="nav-item px-2 d-none d-lg-inline d-md-inline"><a id="loginBtn" href="/login"
                class="btn btn-secondary text-white">Login</a></li>
            <li class="nav-item px-2 d-none d-lg-inline d-md-inline"><a id="signinBtn" href="/register"
                class="btn text-white" style="background-color:#4237f1;">Sign up</a>
            </li>
            <a href="/myprofile" id="profileBtn" class="btn btn-primary text-white">My Profile</a>

            <li class="nav-item dropdown px-2 d-lg-none d-md-none">
              <a href="#" class="nav-link" data-bs-toggle="dropdown">
                <i class="fa-solid fa-bars" style="color: #416cec;"></i>
              </a>
              <div class="dropdown-menu dropdown-menu-end">
                <a href="/home" class="dropdown-item">
                  Home
                </a>
                <a href="#" class="dropdown-item">
                  Jobs
                </a>
                <a href="#" class="dropdown-item">
                  Companies
                </a>
                <a href="/login" class="dropdown-item">
                  Log in
                </a>
                <a href="/register" class="dropdown-item">
                  Sign up
                </a>
              </div>
            </li>
          </ul>
        </div>
      </nav>
    </div>
  </div>
  <script>

    // let userId = /*[[${userId}]]*/ null; // Thymeleaf variable for user ID
    let userId = document.getElementById("userIdHolder").innerText;
    const profileButton = document.getElementById("profileBtn");
    const loginButton = document.getElementById("loginBtn");
    const signinButton = document.getElementById("signinBtn");
    if (!userId) {
      profileButton.style.display = "none"; // Hide button if no ID
      loginButton.style.display = "inline-block"; // Show login button if no ID
      signinButton.style.display = "inline-block"; // Show sign-in button if no ID
    } else {
      profileButton.style.display = "inline-block"; // Show button if ID exists
      loginButton.style.display = "none";
      signinButton.style.display = "none";
    }

  </script>

</body>

</html>
