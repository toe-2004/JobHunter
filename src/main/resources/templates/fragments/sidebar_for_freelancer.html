            <div class="mobile-menu dropdown">

                            <i class="fas fa-briefcase"></i>

                    </li>

                    <li>

	         alt="Profile Photo"
	         class="profile-photo">

	   

	    <div class="profile-info">

            <span class="username"
                    th:text="${user.name}">

            </span>

            <span class="user-role">
