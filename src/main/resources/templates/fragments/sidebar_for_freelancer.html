<div class="sidebar" th:fragment="sidebar">

    <div class="sidebar-brand">

        <div class="mobile-header d-lg-none">

            <a href="/myprofile" class="mobile-profile">
                <img th:if="${user.profilePhoto != null}" th:src="@{'/uploads/' + ${user.profilePhoto}}" 
                        alt="Profile Photo"
                        class="profile-photo">

                <div class="profile-info">
                    <span class="username" th:text="${user.name}">
                        Username
                    </span>
                    <span class="user-role">
                        Freelancer
                    </span>
                </div>
            </a>

            <div class="mobile-menu dropdown">
                <button href="#"
                    class="btn menu-button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">

                    <i class="fa-solid fa-bars"></i>
            </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>
                        <a href="/viewHomeJob" class="dropdown-item">
                            <i class="fas fa-home"></i>
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="/freelancer/dashboard" class="dropdown-item">
                            <i class="fas fa-chart-pie"></i>
                            Dashboard
                        </a>
                    </li>

                    <li>
                        <a href="/my-applications" class="dropdown-item">
                            <i class="fas fa-briefcase"></i>
                            Applications
                        </a>
                    </li>

                    <li>
                        <a href="/my-engagements" class="dropdown-item">
                            <i class="fas fa-handshake"></i>
                            Job Offers
                        </a>
                    </li>

                    <li>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit" class="dropdown-item mobile-logout">
                                <i class="fa-solid fa-right-from-bracket"></i>
                                Logout
                            </button>
                        </form>
                    </li>

                </ul>
            </div>

        </div>

        <div class="desktop-brand d-none d-lg-block">

            <h4 class="mb-0">
                <i class="fa-solid fa-briefcase"></i>
                Job Hunter
            </h4>

        </div>

    </div>

    <nav class="sidebar-nav d-none d-lg-flex flex-column">

        <a href="/viewHomeJob">
            <i class="fas fa-home"></i>
            Home
        </a>

        <a href="/freelancer/dashboard"
        th:classappend="${currentPage == 'dashboard'} ? ' active' : ''">

            <i class="fas fa-chart-pie"></i>
            Dashboard

        </a>

        <a href="/my-applications"
        th:classappend="${currentPage == 'my-applications'} ? ' active' : ''">
            <i class="fas fa-briefcase"></i>
            Applications
        </a>

        <a href="/my-engagements"
        th:classappend="${currentPage == 'my-engagements'} ? ' active' : ''">
            <i class="fas fa-handshake"></i>
            Job Offers
        </a>

		<form th:action="@{/logout}" method="post" class="logout-form">
            <button type="submit" class="logout-button">
                <i class="fa-solid fa-right-from-bracket"></i>
                Logout
            </button>
        </form>
    </nav>

	<a th:href="@{/freelancer/profile}"
        th:classappend="${currentPage == 'profile_f'} ? ' active' : ''"
	   class="sidebar-profile d-none d-lg-flex">

	    <img th:if="${user.profilePhoto != null}"
	         th:src="@{'/uploads/' + ${user.profilePhoto}}"
	         alt="Profile Photo"
	         class="profile-photo">
        <img th:unless="${user.profilePhoto != null}"
            th:src="@{/images/default_profile.jpg}"
            alt="Default Profile Photo"
            class="profile-photo">
	   

	    <div class="profile-info">

            <span class="username"
                    th:text="${user.name}">
                Username
            </span>

            <span class="user-role">
                Freelancer
            </span>

	    </div>

	</a>

</div>
