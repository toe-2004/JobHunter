<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Apply Job</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .container {
            width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 20px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 25px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Apply for Job</h2>

    <h3 th:text="${job.title}">
        Job Title
    </h3>

    <p th:text="${job.description}">
        Description
    </p>



	<form th:action="@{/apply-job/{id}(id=${job.id})}"
	      method="post"
	      th:object="${applicationDto}"
	      enctype="multipart/form-data">

	    <label>Curriculum Vitae</label>

	    <input type="file"
	           th:field="*{curriculumVitae}"
	           accept=".pdf,.doc,.docx"
	           required>

	    <label>Cover Letter</label>

	    <textarea th:field="*{coverLetter}"
	              rows="8"
	              placeholder="Write your cover letter..."
	              required></textarea>

	    <button type="submit">
	        Apply
	    </button>

	</form>


</div>

</body>

</html>
