<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Job Applications</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        .container {
            width: 1100px;
            margin: auto;
        }

        .application-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        .status {
            font-weight: bold;
        }

        .btn {
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            margin-right: 5px;
        }

        .shortlist {
            background: #1976d2;
        }

        .accept {
            background: #2e7d32;
        }

        .reject {
            background: #d32f2f;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        Applications for:
        <span th:text="${job.title}">
        </span>
    </h1>


    <div th:if="${#lists.isEmpty(applications)}">

        <h3>No applications yet.</h3>

    </div>


    <div th:each="application : ${applications}"
         class="application-card">


        <h3>
            Freelancer
        </h3>

        <p th:text="${application.freelancer.user.name}">
        </p>


        <p>
            CV:
            <span th:text="${application.curriculumVitae}">
            </span>
        </p>


        <p>
            Cover Letter:
        </p>

        <p th:text="${application.coverLetter}">
        </p>


        <p>

            Status:

            <span class="status"
                  th:text="${application.status}">
            </span>

        </p>




        <div th:if="${application.status.name() == 'PENDING'}">

            <form th:action="@{/application/{id}/status(
                              id=${application.id})}"
                  method="post"
                  style="display:inline;">

                <input type="hidden"
                       name="status"
                       value="SHORTLISTED">

                <button class="btn shortlist"
                        type="submit">

                    Shortlist

                </button>

            </form>


            <form th:action="@{/application/{id}/status(
                              id=${application.id})}"
                  method="post"
                  style="display:inline;">

                <input type="hidden"
                       name="status"
                       value="REJECTED">

                <button class="btn reject"
                        type="submit">

                    Reject

                </button>

            </form>

        </div>



        <div th:if="${application.status.name() == 'SHORTLISTED'}">

            <form th:action="@{/application/{id}/status(
                              id=${application.id})}"
                  method="post"
                  style="display:inline;">

                <input type="hidden"
                       name="status"
                       value="ACCEPTED">

                <button class="btn accept"
                        type="submit">

                    Accept

                </button>

            </form>


            <form th:action="@{/application/{id}/status(
                              id=${application.id})}"
                  method="post"
                  style="display:inline;">

                <input type="hidden"
                       name="status"
                       value="REJECTED">

                <button class="btn reject"
                        type="submit">

                    Reject

                </button>

            </form>

        </div>

    </div>

</div>

</body>

</html>
