<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Applications</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/my-applications.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/my-applications.js}"></script>
</head>

<body>

<div class="dashboard-layout">

    <!-- SIDEBAR -->

    <div class="sidebar-container">

        <div th:replace="~{fragments/sidebar_for_freelancer :: sidebar}"></div>

    </div>


    <!-- MAIN CONTENT -->

    <div class="main-content">

        <div class="container-fluid">

            <div class="page-header">

                <h1>My Applications</h1>

                <p>
                    Track and manage the jobs you have applied for.
                </p>

            </div>

            <div th:if="${#lists.isEmpty(applications)}"
                 class="empty-state">

                <div class="empty-icon">
                    <i class="fa-regular fa-file-lines"></i>
                </div>

                <h3>No applications yet</h3>

                <p>
                    You haven't applied for any jobs yet.
                    Start exploring opportunities and apply for your next job.
                </p>

            </div>

            <div th:each="app : ${applications}"
                 class="application-card">

                <div class="application-top">

                    <div class="job-section">

                        <a th:href="@{/job-details/{id}(id=${app.job.id})}"
                           class="job-title"
                           th:text="${app.job.title}">

                            Job Title

                        </a>

                        <div class="application-date">

                            <i class="fa-regular fa-calendar"></i>

                            <span>Applied on</span>

                            <span th:text="${#temporals.format(app.createdAt, 'MMM dd, yyyy')}">
                                Aug 19, 2026
                            </span>

                        </div>

                    </div>

                    <span class="status"
                          th:classappend="${app.status.name().toLowerCase()}">

                        <i th:if="${app.status.name() == 'PENDING'}"
                           class="fa-regular fa-clock"></i>

                        <i th:if="${app.status.name() == 'SHORTLISTED'}"
                           class="fa-solid fa-star"></i>

                        <i th:if="${app.status.name() == 'ACCEPTED'}"
                           class="fa-solid fa-circle-check"></i>

                        <i th:if="${app.status.name() == 'REJECTED'}"
                           class="fa-solid fa-circle-xmark"></i>

                        <i th:if="${app.status.name() == 'WITHDRAWN'}"
                           class="fa-solid fa-ban"></i>

                        <span th:text="${app.status}">
                            PENDING
                        </span>

                    </span>

                </div>

                <div class="card-divider"></div>

                <div class="cover-letter-section">

                    <div class="cover-letter-title">

                        <i class="fa-regular fa-envelope"></i>

                        <span>Cover Letter</span>

                    </div>

                    <p class="cover-letter">

                        <span class="cover-letter-text"
                              th:attr="data-full-text=${app.coverLetter}">
                        </span>

                        <a href="javascript:void(0)"
                           class="see-more"
                           style="display:none;">

                            See more

                        </a>

                    </p>

                </div>
				
				
				
				<div class="cv-section">

				                            <div class="cv-info">
				                                <i class="fa-regular fa-file-pdf"></i>
				                                <span>
				                                    Applicant CV
				                                </span>
				                            </div>
											
				                            <a
				                                th:href="@{/application/{id}/cv(id=${app.id})}"
				                                class="cv-btn"
				                                target="_blank">
				                                <i class="fa-solid fa-eye"></i>
				                                View CV
				                            </a>

				                        </div>
										
										

                <div class="application-footer">

                    <a th:href="@{/job-details/{id}(id=${app.job.id})}"
                       class="view-job">

                        View Job Post

                        <i class="fa-solid fa-arrow-right"></i>

                    </a>

                    <form th:if="${app.status.name() == 'PENDING'
                                  or app.status.name() == 'SHORTLISTED'}"
                          th:action="@{/application/{id}/withdraw(id=${app.id})}"
                          method="post"
                          style="margin:0;">

                        <button type="submit"
                                class="withdraw-btn"
                                onclick="return confirm('Withdraw this application?')">

                            <i class="fa-solid fa-xmark"></i>

                            Withdraw Application

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
