<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply for Job | JobHunter</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}" defer></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/apply.css}">
    <script th:src="@{/js/apply.js}"></script>

</head>

<body>

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="application-page">
        <div class="application-wrapper">

            <div class="application-card">

                <div class="job-information">
                    <div class="job-label">
                        <i class="fa-solid fa-briefcase"></i>
                        Applying for
                    </div>

                    <h2 th:text="${job.title}">
                        Job Title
                    </h2>

                    <div class="job-category">
                        <i class="fa-solid fa-layer-group"></i>
                        <span th:text="${job.category.name}">
                            Category
                        </span>
                    </div>
                </div>

                <form class="application-form" th:action="@{/apply-job/{id}(id=${job.id})}"
                    th:object="${applicationDto}" method="post" enctype="multipart/form-data">

                    <div class="form-section-title">
                        <i class="fa-regular fa-file-lines"></i>
                        Application Details
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="curriculumVitae">
                            <i class="fa-solid fa-file-arrow-up"></i>
                            Upload Your CV
                            <span class="required">*</span>
                        </label>

                        <div class="file-upload-wrapper">

                            <label class="file-upload">

                                <input type="file" id="curriculumVitae" th:field="*{curriculumVitae}"
                                    accept=".pdf,.doc,.docx" required>

                                <div class="upload-content">

                                    <div class="upload-icon">
                                        <i class="fa-solid fa-cloud-arrow-up"></i>
                                    </div>

                                    <div class="upload-title">
                                        Click to upload your CV
                                    </div>

                                    <div class="upload-subtitle">
                                        PDF, DOC or DOCX
                                    </div>

                                    <div class="selected-cv-name" id="selectedCvName"></div>

                                </div>

                            </label>

                        </div>
                        <div class="help-text">
                            <i class="fa-solid fa-circle-info"></i>
                            Make sure your CV is up to date before submitting.
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="coverLetter">
                            <i class="fa-solid fa-pen-to-square"></i>
                            Cover Letter
                            <span class="required">*</span>
                        </label>

                        <textarea id="coverLetter" class="cover-letter" th:field="*{coverLetter}"
                            placeholder="Introduce yourself, explain why you are interested in this position, and tell the employer why you would be a good fit..."
                            required></textarea>

                        <div class="help-text">
                            <i class="fa-solid fa-lightbulb"></i>
                            Keep your cover letter clear, professional, and relevant to the position.
                        </div>
                    </div>

                    <div class="form-divider"></div>

                    <div class="form-actions">
                        <a href="#" onclick="history.back(); return false;" class="btn-cancel">
                            <i class="fa-solid fa-arrow-left"></i>
                            Cancel
                        </a>

                        <button type="submit" class="btn-submit">
                            <i class="fa-solid fa-paper-plane"></i>
                            Submit Application
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

</body>

</html>
