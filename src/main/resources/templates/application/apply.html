<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Apply for Job</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
        }

        .job-info {
            background: #f1f1f1;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="file"],
        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
        }

        textarea {
            height: 200px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel {
            margin-left: 15px;
            text-decoration: none;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>Apply for Job</h1>


    <div class="job-info">

        <h2 th:text="${job.title}">
            Job Title
        </h2>

        <p>

            Category:

            <span th:text="${job.category.name}">
                Category
            </span>

        </p>

    </div>


    <form
        th:action="@{/apply-job/{id}(id=${job.id})}"
        th:object="${applicationDto}"
        method="post"
        enctype="multipart/form-data">


        <label for="curriculumVitae">
            Upload CV
        </label>

        <input
            type="file"
            id="curriculumVitae"
            th:field="*{curriculumVitae}"
            accept=".pdf,.doc,.docx"
            required>


        <small>
            Accepted formats: PDF, DOC, DOCX
        </small>


        <label for="coverLetter">
            Cover Letter
        </label>

        <textarea
            id="coverLetter"
            th:field="*{coverLetter}"
            placeholder="Write your cover letter here..."
            required></textarea>


        <button type="submit">
            Submit Application
        </button>


        <a href="/jobs"
           class="cancel">

            Cancel

        </a>

    </form>

</div>

</body>

</html>
