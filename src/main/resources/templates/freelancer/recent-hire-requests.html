<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Hire Requests</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet"
          th:href="@{/css/all.min.css}">
    <link rel="stylesheet"
          th:href="@{/css/sidebar.css}">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f6fa;
        }

        .dashboard-layout {
            display: flex;
            min-height: 100vh;
        }

        .sidebar-container {
            width: 250px;
            flex-shrink: 0;
        }

        .main-content {
            flex: 1;
            padding: 35px;
        }

        .page-container {
            max-width: 1100px;
            margin: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 28px;
            color: #222;
        }

        .back-btn {
            text-decoration: none;
            padding: 10px 18px;
            background: #6c757d;
            color: white;
            border-radius: 6px;
        }

        .back-btn:hover {
            background: #555;
            color: white;
        }

        .hire-requests-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .hire-request-item {
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }

        .hire-request-item:last-child {
            border-bottom: none;
        }

        .hire-request-link {
            display: block;
            text-decoration: none;
            color: inherit;
        }

        .hire-request-link:hover {
            color: inherit;
            text-decoration: none;
        }

        .hire-request-row {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 12px;
            border-radius: 10px;
            transition: background 0.2s;
        }

        .hire-request-link:hover .hire-request-row {
            background: #f8f9fa;
        }

        .company-photo {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid #ddd;
            flex-shrink: 0;
        }

        .hire-request-details {
            flex: 1;
        }

        .hire-company-name {
            font-size: 18px;
            font-weight: bold;
            color: #222;
            margin-bottom: 5px;
        }

        .hire-position {
            font-size: 16px;
            color: #555;
            margin-bottom: 5px;
        }

        .hire-category {
            font-size: 14px;
            color: #888;
            margin-bottom: 5px;
        }

        .hire-date {
            font-size: 13px;
            color: #999;
        }

        .hire-status {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: capitalize;
            background: #eee;
            color: #555;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
        }

        .empty-state i {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .empty-state p {
            font-size: 16px;
        }
    </style>
</head>

<body>
<div class="dashboard-layout">

    <div class="sidebar-container">
        <div th:replace="~{fragments/sidebar_for_freelancer :: sidebar}">
        </div>
    </div>

    <main class="main-content">
        <div class="page-container">

            <div class="page-header">
                <h1>
                    Hire Requests
                </h1>

                <a th:href="@{/freelancer/dashboard}"
                   class="back-btn">
                    <i class="fas fa-arrow-left"></i>
                    Dashboard
                </a>
            </div>

            <div class="hire-requests-card">

                <div th:if="${hireRequests == null || hireRequests.isEmpty()}"
                     class="empty-state">
                    <i class="fas fa-handshake"></i>
                    <p>
                        You have no hire requests yet.
                    </p>
                </div>

                <div th:each="engagement : ${hireRequests}"
                     class="hire-request-item">

                    <a th:href="@{/company/{id}(id=${engagement.employer.id})}"
                       class="hire-request-link">

                        <div class="hire-request-row">

                            <img th:if="${engagement.employer.user.profilePhoto != null}"
                                 th:src="@{'/uploads/' + ${engagement.employer.user.profilePhoto}}"
                                 alt="Company Photo"
                                 class="company-photo">

                            <div class="hire-request-details">
                                <div class="hire-company-name"
                                     th:text="${engagement.employer.companyName}">
                                    Company Name
                                </div>

                                <div class="hire-position"
                                     th:text="${engagement.title}">
                                    Engagement Title
                                </div>

                                <div class="hire-category"
                                     th:text="${engagement.category.name}">
                                    Category
                                </div>
                            </div>

                            <span class="hire-status"
                                  th:text="${engagement.status}">
                                PENDING
                            </span>

                        </div>

                    </a>

                </div>

            </div>

        </div>
    </main>

</div>
</body>
</html>
