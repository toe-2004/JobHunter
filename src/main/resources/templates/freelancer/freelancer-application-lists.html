<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/freelancer-application-lists.css}">

    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

    </style>
</head>

<body>
<div class="dashboard-layout">

    <div class="sidebar-container">
        <div th:replace="~{fragments/sidebar_for_freelancer :: sidebar}">
        </div>
    </div>

    <main class="main-content">
        <div class="page-container">

            <div class="page-header">
                <h1>
                    My Applications
                </h1>
                <p>
                    Track the jobs you have applied for and check your application status.
                </p>
            </div>

            <div class="applications-card">

                <div th:if="${applications == null || applications.isEmpty()}"
                     class="empty-state">
                    <i class="fas fa-file-alt"></i>
                    <p>
                        You have not applied for any jobs yet.
                    </p>
                </div>

                <div th:each="app : ${applications}"
                     class="application-item">

                    <a th:href="@{/job-details/{id}(id=${app.job.id})}"
                       class="application-link">

                        <div class="application-row">

                            <img th:if="${app.job.employer.user.profilePhoto != null}"
                                 th:src="@{'/uploads/' + ${app.job.employer.user.profilePhoto}}"
                                 alt="Company Photo"
                                 class="company-photo">

                            <div class="application-details">
                                <div class="company-name"
                                     th:text="${app.job.employer.companyName}">
                                    Company Name
                                </div>

                                <div class="position-name"
                                     th:text="${app.job.title}">
                                    Job Title
                                </div>

                                <div class="category-name"
                                     th:text="${app.job.category.name}">
                                    Category
                                </div>
                            </div>

                            <span class="application-status"
                                  th:classappend="${app.status.name() == 'ACCEPTED'} ? ' status-accepted' :
                                                 (${app.status.name() == 'REJECTED'} ? ' status-rejected' :
                                                 (${app.status.name() == 'SHORTLISTED'} ? ' status-shortlisted' :
                                                 ' status-pending'))"
                                  th:text="${app.status}">
                                PENDING
                            </span>

                        </div>

                    </a>

                </div>

            </div>

        </div>
    </main>

</div>
</body>

</html>
