<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Freelancers</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px;
        }


        /* =========================
           MAIN CONTAINER
           ========================= */

        .container {
            max-width: 1200px;
            margin: auto;
        }


        /* =========================
           HEADER
           ========================= */

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .section-header h2 {
            margin: 0;
            font-size: 28px;
            font-weight: 700;
            color: #222;
        }


        /* =========================
           VIEW ALL BUTTON
           ========================= */

        .view-all {
            text-decoration: none;
            color: #28a745;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .view-all:hover {
            color: #218838;
        }


        /* =========================
           FREELANCER CARD LINK
           ========================= */

        .freelancer-card-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }


        /* =========================
           FREELANCER CARD
           ========================= */

        .freelancer-card {

            background: white;

            border-radius: 12px;

            padding: 20px;

            text-align: center;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);

            transition: all 0.3s ease;

            height: 100%;

            border: 1px solid #eee;
        }


        .freelancer-card:hover {

            transform: translateY(-5px);

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);

        }


        /* =========================
           PROFILE IMAGE
           ========================= */

        .freelancer-image {

            width: 100px;

            height: 100px;

            border-radius: 50%;

            object-fit: cover;

            margin-bottom: 15px;

            border: 3px solid #f1f1f1;
        }


        /* =========================
           NAME
           ========================= */

        .freelancer-card h5 {

            margin-bottom: 8px;

            font-size: 19px;

            font-weight: 700;

            color: #222;
        }


        /* =========================
           TITLE
           ========================= */

        .freelancer-role {

            color: #666;

            font-size: 14px;

            margin-bottom: 15px;
        }


        /* =========================
           SKILLS
           ========================= */

        .freelancer-skills {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 6px;
        }


        .freelancer-skills span {

            background: #eef7f0;

            color: #28a745;

            padding: 5px 9px;

            border-radius: 20px;

            font-size: 12px;

            font-weight: 600;
        }


        /* =========================
           EMPTY STATE
           ========================= */

        .empty-state {

            background: white;

            padding: 50px;

            text-align: center;

            border-radius: 10px;

            color: #777;
        }


        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 768px) {

            body {
                padding: 20px;
            }

            .section-header h2 {
                font-size: 23px;
            }

            .freelancer-card {
                padding: 15px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =========================
         HEADER
         ========================= -->

    <div class="section-header">

        <h2>
            Top Freelancers
        </h2>


       
    </div>



    <!-- =========================
         NO FREELANCERS
         ========================= -->

    <div th:if="${freelancers == null || freelancers.isEmpty()}"
         class="empty-state">

        <i class="fa-solid fa-user-slash"
           style="font-size: 40px; margin-bottom: 15px;">
        </i>

        <h4>
            No freelancers available
        </h4>

        <p>
            There are currently no freelancers to display.
        </p>

    </div>



    <!-- =========================
         FREELANCER CARDS
         ========================= -->

    <div class="row g-4"
         th:if="${freelancers != null && !freelancers.isEmpty()}">


        <!-- FREELANCER -->

        <div class="col-6 col-md-4 col-lg-3"
             th:each="freelancer : ${freelancers}">


            <!-- Click → Freelancer Details -->

            <a th:href="@{/freelancer-details/{id}(id=${freelancer.id})}"
               class="freelancer-card-link">


                <div class="freelancer-card">


                    <!-- =========================
                         PROFILE PHOTO
                         ========================= -->

                    <img th:if="${freelancer.user != null
                                && freelancer.user.profilePhoto != null
                                && !freelancer.user.profilePhoto.isEmpty()}"
                         
                         th:src="@{'/uploads/' + ${freelancer.user.profilePhoto}}"

                         class="freelancer-image"

                         alt="Freelancer Photo">


                    <!-- DEFAULT PHOTO -->

                    <img th:if="${freelancer.user == null
                                || freelancer.user.profilePhoto == null
                                || freelancer.user.profilePhoto.isEmpty()}"

                         th:src="@{/images/default_profile.jpg}"

                         class="freelancer-image"

                         alt="Default Profile Photo">



                    <!-- =========================
                         USER NAME
                         ========================= -->

                    <h5 th:if="${freelancer.user != null}"
                        th:text="${freelancer.user.name}">

                        Freelancer Name

                    </h5>


                    <!-- =========================
                         FREELANCER TITLE
                         ========================= -->

                    <div class="freelancer-role"
                         th:text="${freelancer.title}">

                        Java Developer

                    </div>



                    <!-- =========================
                         SKILLS
                         ========================= -->

                    <div class="freelancer-skills">


                        <!-- First 3 Skills Only -->

                        <span th:each="fs, stat : ${freelancer.freelancerSkills}"
                              th:if="${stat.index < 3}"
                              th:text="${fs.skill.name}">

                            Java

                        </span>


                    </div>


                </div>

            </a>

        </div>


    </div>


</div>


</body>

</html>
