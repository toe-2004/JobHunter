<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Freelancer Profile</title>

    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/freelancer-create.css}">
    <script th:src="@{/js/bootstrap.bundle.min.js}" defer></script>
    <script th:src="@{/js/freelancer-create.js}" defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

    <div class="page">

        <div class="form-container">

            <div class="profile-header">

                <h1>Create Your Freelancer Profile</h1>
                <p>
                    Tell employers about your skills,
                    experience and professional background.
                </p>

            </div>

            <div class="form-body">

                <form th:action="@{/freelancer/profile}"
                    method="post"
                    th:object="${freelancer}">

                    <div class="form-section">
                        
                        <div class="section-title">
                            Basic Information
                        </div>
                        <div class="form-row">

                            <div class="form-group full">

                                <label>Professional Title</label>
                                <input type="text"
                                    th:field="*{title}"
                                    placeholder="e.g. Java Developer"
                                    required>

                            </div>

                            <div class="form-group">

                                <label>Phone</label>
                                <input type="text"
                                    th:field="*{phone}"
                                    placeholder="Enter your phone number">

                            </div>

                            <div class="form-group">

                                <label>Location</label>
                                <input type="text"
                                    th:field="*{location}"
                                    placeholder="e.g. Yangon">

                            </div>

                        </div>

                    </div>

                    <div class="form-section">

                        <div class="skills-header">

                            <div class="section-title">
                                Skills
                            </div>
                            <button type="button"
                                    class="create-skill-btn"
                                    id="openSkillBtn">
                                + Create New Skill
                            </button>

                        </div>

                        <div class="skill-dropdown">

                            <button type="button"
                                    class="skill-dropdown-btn"
                                    id="skillDropdownBtn">

                                <span id="selectedSkillsText">Select your skills</span>
                                <span class="dropdown-arrow">▼</span>

                            </button>

                            <div class="skill-dropdown-menu"
                                id="skillDropdownMenu">

                                <div th:each="skill : ${skills}"
                                    class="skill-option"
                                    th:classappend="${selectedSkillIds.contains(skill.id)} ? 'selected' : ''"
                                    th:attr="data-id=${skill.id}">

                                    <span class="skill-check">✓</span>
                                    <span th:text="${skill.name}">Java</span>

                                </div>

                            </div>

                        </div>

        
                        <div id="selectedSkillInputs"></div>

                    </div>

                    <div class="form-section">

                        <div class="section-title">
                            About Me
                        </div>
                        <div class="form-group">

                            <label>Professional Summary</label>
                            <textarea th:field="*{summary}"
                                    placeholder="Introduce yourself, your strengths and what kind of work you are looking for..."
                                    rows="5">
                            </textarea>

                        </div>

                    </div>

                    <div class="form-section">

                        <div class="section-title">
                            Education
                        </div>
                        <div class="form-group">

                            <label>Education Background</label>
                            <textarea th:field="*{education}"
                                    placeholder="Example: B.Sc. in Software Engineering - University of Computer Studies, Yangon"
                                    rows="4">
                            </textarea>

                        </div>

                    </div>

                    <div class="form-section">

                        <div class="section-title">
                            Experience
                        </div>
                        <div class="form-group">

                            <label>Work Experience</label>
                            <textarea th:field="*{experience}"
                                    placeholder="Describe your previous work experience, projects or internships..."
                                    rows="5">
                            </textarea>

                        </div>

                    </div>

                    <div class="form-actions">

                        <a href="javascript:history.back()" class="cancel-profile-btn">
                            Cancel
                        </a>
                        <button type="submit"
                                class="save-btn">
                            Save Profile
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

    <div class="modal-overlay" id="skillModal">

        <div class="modal">

            <div class="modal-header">

                <h2>Create New Skill</h2>
                <button type="button"
                        class="close-btn"
                        id="closeSkillBtn">
                        &times;
                </button>

            </div>

            <form th:action="@{/freelancer/skill}"
                th:object="${skill}"
                method="post">

                <div class="modal-body">

                    <p>
                        Add a new skill to your
                        freelancer profile.
                    </p>
                    <label>Skill Name</label>
                    <input type="text"
                        th:field="*{name}"
                        placeholder="Example: Java"
                        required>

                </div>

                <div class="modal-footer">

                    <button type="button"
                            class="cancel-btn"
                            id="cancelSkillBtn">
                        Cancel
                    </button>
                    <button type="submit"
                            class="create-btn">
                        Save Skill
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
